<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البيانات الشخصية - علي نبيل الكحلاني</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* خلفية داكنة أنيقة تناسب طابع الأمن السيبراني */
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 35px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: right;
        }
        h1 {
            color: #38bdf8;
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }
        .info-item {
            margin-bottom: 15px;
            font-size: 18px;
            line-height: 1.6;
        }
        .label {
            color: #94a3b8;
            font-weight: bold;
            display: inline-block;
            width: 110px;
        }
        .value {
            color: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>بطاقة بيانات الطالب</h1>
        
        <div class="info-item">
            <span class="label">الاسم:</span>
            <span class="value">علي نبيل الكحلاني</span>
        </div>
        
        <div class="info-item">
            <span class="label">رقم القيد:</span>
            <span class="value">25163094</span>
        </div>
        
        <div class="info-item">
            <span class="label">التخصص:</span>
            <span class="value">الأمن السيبراني</span>
        </div>
        
        <div class="info-item">
            <span class="label">السكن:</span>
            <span class="value">صنعاء</span>
        </div>
    </div>

</body>
</html>
